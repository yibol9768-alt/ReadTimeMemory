<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <title>A pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edcf2"/>
      <stop offset="1" stop-color="#e5f7f4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#e7eee9"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9eafb5"/>
      <stop offset="1" stop-color="#647b83"/>
    </linearGradient>
  </defs>

  <rect width="700" height="500" fill="url(#sky)"/>
  <circle cx="590" cy="82" r="38" fill="#ffe7a0"/>
  <g fill="#ffffff" opacity=".72">
    <path d="M74 109c10-22 42-24 55-5 18-17 53-5 51 20H57c-2-7 4-13 17-15z"/>
    <path d="M505 151c8-17 32-20 44-5 17-13 40-3 42 16h-99c-1-5 3-9 13-11z"/>
  </g>
  <path d="M0 424c116-17 194 8 304-3 129-13 245-20 396 4v75H0z" fill="#b8d99c"/>
  <path d="M0 430c124-16 216 8 318-3 128-14 255-17 382 3" fill="none" stroke="#82b77f" stroke-width="5" opacity=".65"/>

  <!-- Bicycle -->
  <g stroke="#263d48" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="6">
      <circle cx="190" cy="395" r="77" fill="#f5fbf7"/>
      <circle cx="515" cy="395" r="77" fill="#f5fbf7"/>
    </g>
    <g stroke="#86a2a5" stroke-width="2" opacity=".8">
      <line x1="190" y1="395" x2="190" y2="318"/>
      <line x1="190" y1="395" x2="190" y2="472"/>
      <line x1="190" y1="395" x2="113" y2="395"/>
      <line x1="190" y1="395" x2="267" y2="395"/>
      <line x1="190" y1="395" x2="136" y2="341"/>
      <line x1="190" y1="395" x2="244" y2="449"/>
      <line x1="190" y1="395" x2="244" y2="341"/>
      <line x1="190" y1="395" x2="136" y2="449"/>
      <line x1="515" y1="395" x2="515" y2="318"/>
      <line x1="515" y1="395" x2="515" y2="472"/>
      <line x1="515" y1="395" x2="438" y2="395"/>
      <line x1="515" y1="395" x2="592" y2="395"/>
      <line x1="515" y1="395" x2="461" y2="341"/>
      <line x1="515" y1="395" x2="569" y2="449"/>
      <line x1="515" y1="395" x2="569" y2="341"/>
      <line x1="515" y1="395" x2="461" y2="449"/>
    </g>
    <path d="M190 395l90-95 70 95H190zm90-95l235 95M350 395h165" fill="#b7e0df" fill-opacity=".42" stroke-width="8"/>
    <path d="M515 395l-25-115" fill="none" stroke-width="8"/>
    <path d="M490 280l-7-20 20-8 18 8" fill="none" stroke-width="7"/>
    <path d="M280 300l-10-28" fill="none" stroke-width="7"/>
    <path d="M251 270h39" fill="none" stroke-width="8"/>
    <circle cx="350" cy="395" r="13" fill="#f4c253" stroke-width="5"/>
    <path d="M350 395l-25 16M350 395l27-17" fill="none" stroke-width="5"/>
    <path d="M319 411h-17M377 378h17" fill="none" stroke-width="5"/>
    <circle cx="190" cy="395" r="7" fill="#f4c253" stroke-width="4"/>
    <circle cx="515" cy="395" r="7" fill="#f4c253" stroke-width="4"/>
  </g>

  <!-- Pelican legs and feet -->
  <g fill="none" stroke="#df873b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M337 274c-4 27 8 54 18 83l-29 38" stroke-width="10"/>
    <path d="M387 275c4 30-11 58-29 89l27 30" stroke-width="10"/>
    <path d="M326 395l-18 8m18-8-5 14m5-14 12 7" stroke-width="5"/>
    <path d="M385 394l18 7m-18-7 5 14m-5-14-12 7" stroke-width="5"/>
  </g>

  <!-- Pelican tail and body -->
  <path d="M445 234c37 2 61 17 74 37-28 3-55-4-77-18z" fill="#dce8e4" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>
  <path d="M300 222c3-43 37-70 84-69 54 1 91 32 98 74 7 42-22 73-69 84-48 11-91-7-108-43-7-14-8-30-5-46z"
        fill="url(#body)" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>

  <!-- Far wing reaching toward the handlebar -->
  <path d="M389 178c35 1 72 28 101 75l-19 27c-24-36-48-59-81-70z"
        fill="#82979d" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>
  <path d="M471 268l20 10m-28-21 20 8" fill="none" stroke="#d5e0dc" stroke-width="4"/>

  <!-- Main folded wing -->
  <path d="M329 190c34-17 87-4 119 28-7 36-39 65-90 74-20-25-31-67-29-102z"
        fill="url(#wing)" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>
  <path d="M347 205c9 25 21 52 39 78m-21-83c10 24 25 48 43 68m-16-58c11 17 24 32 38 44"
        fill="none" stroke="#d2deda" stroke-width="5" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M278 139c27 1 48 19 56 48l17 54-40 13c-10-37-20-72-42-91z"
        fill="url(#body)" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>

  <!-- Pelican head -->
  <path d="M278 121c-1-26 16-43 39-41 25 2 38 23 31 47-5 20-24 34-44 29-16-4-25-17-26-35z"
        fill="url(#body)" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>
  <path d="M288 84c7-13 17-17 27-15-3 8-1 13 5 18" fill="none" stroke="#647b83" stroke-width="7" stroke-linecap="round"/>

  <!-- Beak and throat pouch -->
  <path d="M297 112c-56-5-132 7-204 31 51 14 115 40 193 32 17-13 22-39 11-63z"
        fill="#f3b34f" stroke="#263d48" stroke-width="7" stroke-linejoin="round"/>
  <path d="M104 143c58 3 126 13 186 10" fill="none" stroke="#c87935" stroke-width="5" stroke-linecap="round"/>
  <path d="M274 164c8 16 4 40-17 57-23-12-39-34-35-56 18 6 35 7 52-1z"
        fill="#e68649" stroke="#263d48" stroke-width="6" stroke-linejoin="round"/>
  <path d="M237 174c12 8 25 12 39 11" fill="none" stroke="#f7bd62" stroke-width="4" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="312" cy="111" r="8" fill="#263d48"/>
  <circle cx="315" cy="108" r="2.5" fill="#ffffff"/>
</svg>